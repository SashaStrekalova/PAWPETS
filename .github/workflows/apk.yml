 name: Build APK
on: [push, workflow_dispatch]
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          npm install -g @capacitor/cli
          npx cap init Lapki com.lapki.app --web-dir .
          npx cap add android
      - uses: ionic-team/capacitor-action-build-android@v1
